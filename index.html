<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日英文 Daily English</title>
<style>
  :root {
    --bg: #F7F5FA;
    --surface: #FFFFFF;
    --ink: #26233A;
    --muted: #6F6B85;
    --line: #E4E0EE;
    --accent: #B4436C;
    --accent-soft: #F6E7ED;
    --good: #2E7D5B;
    --good-soft: #E3F1EA;
    --bad: #C25454;
    --bad-soft: #F8E8E8;
    --mark: #FCEED2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1B1926; --surface: #242233; --ink: #E9E6F2; --muted: #9C97B5;
      --line: #3A374E; --accent: #E4708F; --accent-soft: #3A2733;
      --good: #58B58D; --good-soft: #24352D; --bad: #E07A7A; --bad-soft: #3A2828;
      --mark: #4A3E28;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1926; --surface: #242233; --ink: #E9E6F2; --muted: #9C97B5;
    --line: #3A374E; --accent: #E4708F; --accent-soft: #3A2733;
    --good: #58B58D; --good-soft: #24352D; --bad: #E07A7A; --bad-soft: #3A2828;
    --mark: #4A3E28;
  }
  :root[data-theme="light"] {
    --bg: #F7F5FA; --surface: #FFFFFF; --ink: #26233A; --muted: #6F6B85;
    --line: #E4E0EE; --accent: #B4436C; --accent-soft: #F6E7ED;
    --good: #2E7D5B; --good-soft: #E3F1EA; --bad: #C25454; --bad-soft: #F8E8E8;
    --mark: #FCEED2;
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", "Microsoft JhengHei", -apple-system, "PingFang TC", sans-serif;
    line-height: 1.65; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 20px 16px 64px; display: flex; flex-direction: column; gap: 20px; }

  header.top { padding: 8px 4px 0; }
  .kicker { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  h1.site { font-size: 26px; margin: 4px 0 10px; letter-spacing: .01em; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-size: 13px; padding: 3px 12px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
  }
  .chip.theme { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }

  section.card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px 18px;
  }
  .eyebrow {
    font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--muted); font-weight: 700; margin: 0 0 10px;
  }
  .eyebrow b { color: var(--accent); }

  /* 影片 */
  .video-title { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
  .video-meta { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  .video-intro { margin: 0 0 12px; }
  .tasks { margin: 0 0 16px; padding: 12px 14px; background: var(--accent-soft); border-radius: 10px; }
  .tasks p { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--accent); }
  .tasks ol { margin: 0; padding-left: 20px; font-size: 14.5px; }
  a.watch {
    display: block; text-align: center; text-decoration: none;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 16px;
    padding: 13px 16px; border-radius: 10px;
  }
  a.watch:active { opacity: .85; }

  /* 短文 */
  .article-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 24px; margin: 0 0 14px; line-height: 1.3; text-wrap: balance;
  }
  .article p {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px; line-height: 1.8; margin: 0 0 14px;
  }
  .article p:last-child { margin-bottom: 0; }
  .vhl {
    border-bottom: 2px solid var(--accent); cursor: pointer;
    background: transparent; padding: 0 1px;
  }

  /* 測驗 */
  .modebar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .modebtns { display: flex; gap: 10px; }
  .modebtn {
    flex: 1; padding: 10px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .modebtn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .names { display: none; gap: 10px; }
  .names.show { display: flex; }
  .names input {
    flex: 1; min-width: 0; padding: 8px 12px; border-radius: 8px;
    border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); font-size: 15px;
  }
  .mode-locked { font-size: 12.5px; color: var(--muted); }

  /* 連線對戰房間面板 */
  .modebtn.online.on { border-color: var(--good); background: var(--good-soft); color: var(--good); }
  .roompanel { display: none; flex-direction: column; gap: 10px; padding: 12px; border: 1.5px dashed var(--line); border-radius: 10px; }
  .roompanel.show { display: flex; }
  .roomrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .roomrow input { flex: 1; min-width: 90px; padding: 9px 12px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); font-size: 15px; }
  .roombtn { padding: 9px 14px; border-radius: 8px; border: 1.5px solid var(--good); background: var(--good-soft); color: var(--good); font-weight: 700; font-size: 14.5px; cursor: pointer; white-space: nowrap; }
  .roombtn:disabled { opacity: .5; cursor: default; }
  .roomcode { font-size: 26px; font-weight: 800; letter-spacing: .28em; text-align: center; color: var(--good); font-variant-numeric: tabular-nums; }
  .roomstatus { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.5; }
  .roomstatus.live { color: var(--good); font-weight: 700; }
  .roomstatus.err { color: var(--bad); font-weight: 700; }
  .waiting { font-size: 13px; color: var(--muted); margin: 8px 0 0; font-style: italic; }

  .qcard { border-top: 1px solid var(--line); padding: 16px 0 6px; }
  .qcard:first-of-type { border-top: none; padding-top: 4px; }
  .qnum { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .06em; }
  .qtext { font-size: 16.5px; font-weight: 600; margin: 4px 0 12px; }
  .turn { font-size: 13.5px; margin: 0 0 10px; color: var(--muted); }
  .turn b { color: var(--accent); }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    text-align: left; padding: 11px 14px; border-radius: 10px;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    font-size: 15.5px; cursor: pointer; line-height: 1.5;
    display: flex; align-items: baseline; gap: 10px;
  }
  .opt .tagbox { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
  .ptag {
    font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
  }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--good); background: var(--good-soft); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .opt.dim { opacity: .55; }
  .explain {
    margin: 12px 0 8px; padding: 12px 14px; border-radius: 10px;
    background: var(--bg); border: 1px dashed var(--line); font-size: 14.5px;
  }
  .explain b { color: var(--accent); }

  /* 比分 */
  .scorebar {
    position: sticky; top: 8px; z-index: 5; display: none;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 18px; font-size: 14px; font-weight: 700;
    justify-content: center; gap: 18px; box-shadow: 0 4px 14px rgba(0,0,0,.08);
  }
  .scorebar.show { display: flex; }
  .summary { text-align: center; padding: 22px 18px; }
  .summary .big { font-size: 34px; font-weight: 800; margin: 6px 0; font-variant-numeric: tabular-nums; }
  .summary .verdict { font-size: 16px; }

  /* 文法 */
  .gcard { border-top: 1px solid var(--line); padding: 16px 0 8px; }
  .gcard:first-of-type { border-top: none; padding-top: 2px; }
  .gname { font-size: 17px; font-weight: 700; margin: 0 0 8px; }
  .gsent {
    font-family: Georgia, serif; font-size: 16px; margin: 0 0 10px;
    padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 8px 8px 0;
  }
  .gsent mark { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 3px; }
  .grule { margin: 0 0 10px; font-size: 15px; }
  .gex { margin: 0 0 10px; padding-left: 4px; }
  .gex .en { font-family: Georgia, serif; font-size: 15px; }
  .gex .zh { font-size: 13.5px; color: var(--muted); margin-bottom: 6px; }
  .gmis { font-size: 14px; color: var(--bad); background: var(--bad-soft); padding: 8px 12px; border-radius: 8px; }

  /* 單字 */
  .vgrid { display: flex; flex-direction: column; gap: 10px; }
  .vcard {
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    transition: box-shadow .3s;
  }
  .vcard.flash { box-shadow: 0 0 0 2px var(--accent); }
  .vhead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .vword { font-size: 17px; font-weight: 700; }
  .vpos, .vpho { font-size: 13px; color: var(--muted); }
  .vzh { font-size: 15px; color: var(--accent); font-weight: 600; }
  .vex { font-family: Georgia, serif; font-size: 14.5px; margin: 6px 0 0; }
  .vexzh { font-size: 13px; color: var(--muted); }

  footer.end { text-align: center; color: var(--muted); font-size: 14.5px; padding: 8px 16px 0; }
  footer.end .closing { color: var(--ink); font-size: 15.5px; margin-bottom: 6px; }

  :is(button, a, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="kicker">Daily English · 每日英文</div>
    <h1 class="site" id="siteTitle">今晚的一課</h1>
    <div class="chips" id="chips"></div>
  </header>

  <div class="scorebar" id="scorebar"></div>

  <section class="card" id="videoCard">
    <p class="eyebrow"><b>01</b> 看影片 · Watch</p>
    <div id="videoBody"></div>
  </section>

  <section class="card">
    <p class="eyebrow"><b>02</b> 讀短文 · Read</p>
    <h2 class="article-title" id="articleTitle"></h2>
    <div class="article" id="articleBody"></div>
    <p style="font-size:12.5px;color:var(--muted);margin:12px 0 0;">
      有底線的字是今天的單字，點一下可以跳到單字表。</p>
  </section>

  <section class="card">
    <p class="eyebrow"><b>03</b> 閱讀測驗 · Quiz</p>
    <div class="modebar" id="modebar">
      <div class="modebtns">
        <button class="modebtn on" id="soloBtn" type="button">🙋 單人</button>
        <button class="modebtn" id="duoBtn" type="button">💑 同機雙人</button>
        <button class="modebtn online" id="onlineBtn" type="button">🌐 連線對戰</button>
      </div>
      <div class="names" id="names">
        <input id="n1" maxlength="8" value="玩家 1" aria-label="玩家一暱稱">
        <input id="n2" maxlength="8" value="玩家 2" aria-label="玩家二暱稱">
      </div>
      <div class="roompanel" id="roompanel">
        <div class="roomrow">
          <input id="myname" maxlength="8" value="我" placeholder="你的暱稱" aria-label="你的暱稱">
        </div>
        <div class="roomrow">
          <button class="roombtn" id="createRoom" type="button">＋ 建立房間</button>
          <input id="joincode" maxlength="4" placeholder="輸入房號" aria-label="房間代號" style="text-transform:uppercase">
          <button class="roombtn" id="joinRoom" type="button">加入</button>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 頂部資訊與連續天數 ---------- */
(function header() {

  try {
    const saved = JSON.parse(localStorage.getItem('de_streak') || 'null');

      const last = new Date(saved.last), today = new Date(LESSON.date);
      const diff = Math.round((today - last) / 86400000);

      else if (diff === 1) streak = saved.n + 1;

/* ---------- 短文（自動標亮單字） ---------- */
(function article() {
  $('articleTitle').textContent = LESSON.article.title;
  const marked = new Set();
  $('articleBody').innerHTML = LESSON.article.paragraphs.map(p => {

  $('articleBody').addEventListener('click', (e) => {

/* ---------- 測驗引擎（單人／雙人共用） ---------- */
const state = {
  mode: 'solo', locked: false,
  score: { solo: 0, p1: 0, p2: 0 },
  total: 0, answered: 0,
  groups: []
};
const nameOf = (p) => esc((p === 0 ? $('n1').value : $('n2').value).trim() || (p === 0 ? '玩家 1' : '玩家 2'));

$('soloBtn').addEventListener('click', () => setMode('solo'));
$('duoBtn').addEventListener('click', () => setMode('duo'));
$('onlineBtn').addEventListener('click', () => setMode('online'));
function setMode(m) {
  if (state.locked) return;
  state.mode = m;
  $('soloBtn').classList.toggle('on', m === 'solo');
  $('duoBtn').classList.toggle('on', m === 'duo');
  $('onlineBtn').classList.toggle('on', m === 'online');
  $('names').classList.toggle('show', m === 'duo');
  $('roompanel').classList.toggle('show', m === 'online');
  if (m === 'duo') $('modeHint').textContent = '同機雙人：兩人用這一支手機輪流作答，都答完才公布、看誰對。先填好暱稱！';
  else if (m === 'online') $('modeHint').textContent = '連線對戰：各自用自己的手機，一人建房、一人輸房號加入，答題即時同步比分。';
  else $('modeHint').textContent = '單人模式：點選答案立刻公布對錯與解析。';
  document.querySelectorAll('.turn').forEach(el => { el.hidden = (m !== 'duo'); });
  updateTurnLabels();
}

function buildGroup(list, boxId) {
  const box = $(boxId);
  if (!list || !list.length) return;
  state.total += list.length;
  list.forEach((q, qi) => {
    const qs = { q, picks: [null, null], turn: 0, done: false };
    state.groups.push(qs);
    const idx = state.groups.length - 1;
    const el = document.createElement('div');
    el.className = 'qcard';
    el.innerHTML =
      '<div class="qnum">Q' + (qi + 1) + '</div>' +
      '<div class="qtext">' + esc(q.q) + '</div>' +
      '<p class="turn" hidden>輪到 <b class="turnname"></b> 作答</p>' +
      '<div class="opts">' + q.options.map((o, oi) =>
        '<button class="opt" type="button" data-g="' + idx + '" data-o="' + oi + '">' +
        '<span>' + esc(o) + '</span><span class="tagbox"></span></button>'
      ).join('') + '</div>' +
      '<div class="explain" hidden><b>解析：</b>' + esc(q.explain) + '</div>';
    box.appendChild(el);
  });
  box.addEventListener('click', onPick);
}

function onPick(e) {
  const btn = e.target.closest('.opt');
  if (!btn || btn.disabled) return;
  const g = state.groups[+btn.dataset.g];
  if (!g || g.done) return;

  if (state.mode === 'online') { onPickOnline(btn, g); return; }

  if (!state.locked) { state.locked = true; $('modeHint').textContent = '測驗進行中，模式已鎖定。'; $('scorebar').classList.add('show'); renderScore(); }

  const oi = +btn.dataset.o;
  const card = btn.closest('.qcard');

  if (state.mode === 'solo') {
    g.picks[0] = oi; g.done = true;
    if (oi === g.q.answer) state.score.solo++;
    reveal(card, g, [['🙋', oi]]);
  } else {
    g.picks[g.turn] = oi;
    if (g.turn === 0) {
      g.turn = 1;
      updateTurnLabel(card, g);
    } else {
      g.done = true;
      if (g.picks[0] === g.q.answer) state.score.p1++;
      if (g.picks[1] === g.q.answer) state.score.p2++;
      reveal(card, g, [[nameOf(0), g.picks[0]], [nameOf(1), g.picks[1]]]);
    }
  }
  renderScore();
}

function reveal(card, g, picks) {
  card.querySelectorAll('.opt').forEach(b => {
    const oi = +b.dataset.o;
    b.disabled = true;
    const tags = picks.filter(p => p[1] === oi);
    if (tags.length) b.querySelector('.tagbox').innerHTML = tags.map(t => '<span class="ptag">' + t[0] + '</span>').join('');
    if (oi === g.q.answer) b.classList.add('correct');
    else if (tags.length) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const turnEl = card.querySelector('.turn'); if (turnEl) turnEl.hidden = true;
  card.querySelector('.explain').hidden = false;
  state.answered++;
  if (state.answered === state.total) finish();
}

function updateTurnLabel(card, g) {
  const el = card.querySelector('.turn');
  if (!el) return;
  el.hidden = (state.mode !== 'duo') || g.done;
  el.querySelector('.turnname').innerHTML = nameOf(g.turn) + (g.turn === 1 ? '（' + nameOf(0) + ' 已作答 ✓）' : '');
}
function updateTurnLabels() {
  document.querySelectorAll('.qcard').forEach(card => {
    const anyBtn = card.querySelector('.opt');
    if (!anyBtn) return;
    const g = state.groups[+anyBtn.dataset.g];
    if (g && !g.done) updateTurnLabel(card, g);
  });
}

function renderScore() {
  const bar = $('scorebar');
  if (state.mode === 'solo') {
    bar.innerHTML = '🙋 ' + state.score.solo + ' 分 <span style="color:var(--muted)">（' + state.answered + '/' + state.total + ' 題）</span>';
  } else if (state.mode === 'online') {
    const partner = net.partnerId ? esc(net.partnerName) : '（等待中）';
    bar.innerHTML = '<span>' + esc(net.myName) + ' ' + net.scoreMe + '</span><span style="color:var(--muted)">vs</span><span>' + partner + ' ' + net.scorePartner + '</span>';
  } else {
    bar.innerHTML = '<span>' + nameOf(0) + ' ' + state.score.p1 + '</span><span style="color:var(--muted)">vs</span><span>' + nameOf(1) + ' ' + state.score.p2 + '</span>';
  }
}

function finish() {
  const s = $('summaryCard'); s.hidden = false;
  let html = '';
  if (state.mode === 'solo') {
    const pct = state.score.solo / state.total;
    const msg = pct === 1 ? '全對！太強了 🎉' : pct >= 0.7 ? '很不錯，錯的看解析補起來 💪' : '沒關係，解析看完就是你的了 📖';
    html = '<div class="big">' + state.score.solo + ' / ' + state.total + '</div><div class="verdict">' + msg + '</div>';
  } else if (state.mode === 'online') {
    const a = net.scoreMe, b = net.scorePartner;
    const verdict = a === b ? '平手！一起看解析 🤝'
      : (a > b ? esc(net.myName) : esc(net.partnerName)) + ' 獲勝 🏆 輸的人記得請喝飲料（開玩笑的，一起看解析）';
    html = '<div class="big">' + a + '：' + b + '</div>' +
           '<div class="verdict">' + esc(net.myName) + ' vs ' + esc(net.partnerName) + ' — ' + verdict + '</div>';
  } else {
    const a = state.score.p1, b = state.score.p2;
    const verdict = a === b ? '平手！一起看解析 🤝'
      : (a > b ? nameOf(0) : nameOf(1)) + ' 獲勝 🏆 輸的人記得請喝飲料（開玩笑的，一起看解析）';
    html = '<div class="big">' + a + '：' + b + '</div>' +
           '<div class="verdict">' + nameOf(0) + ' vs ' + nameOf(1) + ' — ' + verdict + '</div>';
  }
  s.querySelector('#summaryBody').innerHTML = html;
  s.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ---------- 連線對戰（跨裝置即時同步，走公開 MQTT 中繼） ---------- */
const net = {
  client: null, room: null, connected: false, started: false,
  myId: 'p' + Math.random().toString(36).slice(2, 8),
  myName: '我', partnerId: null, partnerName: '對方',
  answers: {}, revealed: new Set(), scoreMe: 0, scorePartner: 0
};
const BROKER = 'wss://broker.emqx.io:8084/mqtt';
const roomTopic = () => 'de/room/' + net.room;

function genCode() {
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';  // 去掉易混的 I O 0 1
  let s = ''; for (let i = 0; i < 4; i++) s += c[Math.floor(Math.random() * c.length)];
  return s;
}
function setStatus(msg, cls) { const el = $('roomstatus'); el.className = 'roomstatus' + (cls ? ' ' + cls : ''); el.textContent = msg; }
function setRoomLive() {
  setStatus('已連上！你是「' + net.myName + '」，對手是「' + net.partnerName + '」。開始作答，比分即時同步。', 'live');
}

$('createRoom').addEventListener('click', () => startOnline(genCode(), true));
$('joinRoom').addEventListener('click', () => {
  const code = ($('joincode').value || '').trim().toUpperCase();
  if (code.length < 4) { setStatus('請先輸入 4 位房號', 'err'); return; }
  startOnline(code, false);
});

function startOnline(code, isCreator) {
  if (net.started) return;
  if (typeof mqtt === 'undefined') {
    setStatus('連線服務載入失敗（可能是網路擋住），請改用「💑 同機雙人」。', 'err'); return;
  }
  net.started = true;
  net.myName = (($('myname').value || '').trim() || '我').slice(0, 8);
  net.room = code;
  state.locked = true;  // 鎖定模式，開賽後不再切換
  ['createRoom', 'joinRoom', 'myname', 'joincode'].forEach(id => { $(id).disabled = true; });
  setStatus('連線中…');

  net.client = mqtt.connect(BROKER, {
    clientId: 'de_' + net.myId, clean: true, connectTimeout: 8000, reconnectPeriod: 4000
  });
  net.client.on('connect', () => {
    net.connected = true;
    net.client.subscribe(roomTopic(), () => {
      netPublish({ t: 'hello', id: net.myId, name: net.myName });
      if (isCreator) { $('roomcode').hidden = false; $('roomcode').textContent = code; }
      if (!net.partnerId) setStatus(isCreator ? ('房號：' + code + '　把它報給對方，等加入…') : ('已加入 ' + code + '，等對方…'));
      $('scorebar').classList.add('show'); renderScore();
    });
  });
  net.client.on('message', (t, payload) => {
    let m; try { m = JSON.parse(payload.toString()); } catch (e) { return; }
    onNetMessage(m);
  });
  net.client.on('error', () => setStatus('連線出錯，請重新整理再試，或改用同機雙人。', 'err'));
  net.client.on('close', () => { net.connected = false; });
}

function netPublish(obj) {
  if (net.client && net.connected) net.client.publish(roomTopic(), JSON.stringify(obj));
}

function bindPartner(id, name) {
  if (net.partnerId || id === net.myId) return;
  net.partnerId = id;
  net.partnerName = (name || '對方').slice(0, 8);
  setRoomLive(); renderScore();
  // 對手加入前我可能已作答，補送給對方，並嘗試把等待中的題目揭曉
  Object.keys(net.answers).forEach(q => {
    const o = net.answers[q][net.myId];
    if (o != null) netPublish({ t: 'answer', id: net.myId, q: +q, opt: o });
    maybeRevealOnline(+q, null);
  });
}

function onNetMessage(m) {
  if (!m || m.id === net.myId) return;
  if (m.t === 'hello') {
    bindPartner(m.id, m.name);
    netPublish({ t: 'hi', id: net.myId, name: net.myName });  // 讓對方也認得我
    return;
  }
  if (m.t === 'hi') { bindPartner(m.id, m.name); return; }
  if (m.t === 'answer') {
    bindPartner(m.id, m.name);
    recordAnswer(m.q, m.id, m.opt);
    maybeRevealOnline(m.q, null);
    return;
  }
}

function onPickOnline(btn, g) {
  if (!net.connected) { setStatus('尚未連上中繼，請稍候或重新整理。', 'err'); return; }
  if (!net.partnerId) { setStatus('還沒連上對方——確認兩支手機用同一個房號。', 'err'); return; }
  const q = +btn.dataset.g;
  if (net.answers[q] && net.answers[q][net.myId] != null) return;  // 已作答
  const oi = +btn.dataset.o;
  recordAnswer(q, net.myId, oi);
  netPublish({ t: 'answer', id: net.myId, q: q, opt: oi });
  const card = btn.closest('.qcard');
  const partnerDone = net.answers[q] && net.answers[q][net.partnerId] != null;
  if (!partnerDone) markMyPickOnline(card, oi);
  maybeRevealOnline(q, card);
}

function recordAnswer(q, id, opt) {
  if (!net.answers[q]) net.answers[q] = {};
  net.answers[q][id] = opt;
}

function markMyPickOnline(card, oi) {
  card.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (+b.dataset.o === oi) b.querySelector('.tagbox').innerHTML = '<span class="ptag">' + esc(net.myName) + '</span>';
  });
  if (!card.querySelector('.waiting')) {
    const w = document.createElement('p');
    w.className = 'waiting'; w.textContent = '已作答，等對方作答中…';
    card.querySelector('.opts').after(w);
  }
}

function maybeRevealOnline(q, card) {
  const a = net.answers[q];
  if (!a || net.partnerId == null) return;
  if (a[net.myId] == null || a[net.partnerId] == null) return;
  if (net.revealed.has(q)) return;
  net.revealed.add(q);
  if (!card) { const ob = document.querySelector('.opt[data-g="' + q + '"]'); card = ob ? ob.closest('.qcard') : null; }
  if (!card) return;
  const w = card.querySelector('.waiting'); if (w) w.remove();
  const g = state.groups[q];
  g.done = true;
  if (a[net.myId] === g.q.answer) net.scoreMe++;
  if (a[net.partnerId] === g.q.answer) net.scorePartner++;
  reveal(card, g, [[net.myName, a[net.myId]], [net.partnerName, a[net.partnerId]]]);
  renderScore();
}

buildGroup(LESSON.quiz, 'quizBox');
if (LESSON.review && LESSON.review.length) { $('reviewCard').hidden = false; buildGroup(LESSON.review, 'reviewBox'); }
if (LESSON.weekly && LESSON.weekly.length) { $('weeklyCard').hidden = false; buildGroup(LESSON.weekly, 'weeklyBox'); }
setMode('solo');

/* ---------- 文法 ---------- */
(function grammar() {
  $('grammarBox').innerHTML = LESSON.grammar.map(g => {
    let sent = esc(g.sentence);
    if (g.highlight) {
      const h = esc(g.highlight);
      sent = sent.replace(h, '<mark>' + h + '</mark>');
    }
    return '<div class="gcard">' +
      '<p class="gname">' + esc(g.name) + '</p>' +
      '<p class="gsent">' + sent + '</p>' +
      '<p class="grule">' + esc(g.rule) + '</p>' +
      '<div class="gex">' + g.examples.map(ex =>
        '<div class="en">' + esc(ex.en) + '</div><div class="zh">' + esc(ex.zh) + '</div>'
      ).join('') + '</div>' +
      '<div class="gmis">⚠️ 常見錯誤：' + esc(g.mistake) + '</div>' +
    '</div>';
  }).join('');
})();

/* ---------- 單字表 ---------- */
(function vocab() {
  $('vocabBox').innerHTML = LESSON.vocab.map((v, i) =>
    '<div class="vcard" data-v="' + i + '">' +
      '<div class="vhead"><span class="vword">' + esc(v.word) + '</span>' +
      '<span class="vpos">' + esc(v.pos) + '</span>' +
      '<span class="vpho">/' + esc(v.phonetic) + '/</span>' +
      '<span class="vzh">' + esc(v.zh) + '</span></div>' +
      '<p class="vex">' + esc(v.example) + '</p>' +
      '<div class="vexzh">' + esc(v.example_zh) + '</div>' +
    '</div>'
  ).join('');
})();

$('closing').textContent = LESSON.closing;
</script>
